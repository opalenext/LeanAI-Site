<style>/* Layout: one guided journey (model → diagnostic → report & roadmap → 2030 vision → The News Fix), one column of reading width with wider boards for report and roadmap. Identity: shared charter (warm white, ink, emerald accent, brick, blue, violet; Space Grotesk and IBM Plex Sans) with the O hexagon mark. The News Fix is printed paper in both themes. */
:root{
  --bg:#F5F5F1; --surface:#FFFFFF; --fg:#12161C; --muted:#5A6270; --line:#DADCD5; --soft:#ECEDE7;
  --accent:#0F6E5D; --accent-ink:#FFFFFF; --accent-soft:#E1EEEA; --teal:#2C5687; --prod:#12161C;
  --ok:#1F8A63; --ok-bg:#E3F5EC; --warn:#8F5100; --warn-bg:#FFF1DA;
  --s1:#A74018; --s2:#0F6E5D; --s3:#2C5687; --s4:#8A4F9E; --on-bar:#FFFFFF;
  --display:"Space Grotesk","Segoe UI",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --paper:#F7F3EA; --ink:#1B1B1B; --ink-soft:#4A4A4A; --rule:#1B1B1B;
  --news:"Playfair Display",Georgia,"Times New Roman",serif; --newsbody:"Source Serif 4",Georgia,serif; --black:"UnifrakturCook","Old English Text MT",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101317; --surface:#181C21; --fg:#ECEBE6; --muted:#A3A8AE; --line:#2B3036; --soft:#1E2328;
  --accent:#62B8AC; --accent-ink:#0B1512; --accent-soft:#16302B; --teal:#6FA0E6; --prod:#C9CDD2;
  --ok:#5FD3A5; --ok-bg:#12342A; --warn:#F2B04C; --warn-bg:#3A2A10;
  --s1:#E3916F; --s2:#5DBE9C; --s3:#6FA0E6; --s4:#D3A6E6; --on-bar:#101317; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181C21; --fg:#ECEBE6; --muted:#A3A8AE; --line:#2B3036; --soft:#1E2328;
  --accent:#62B8AC; --accent-ink:#0B1512; --accent-soft:#16302B; --teal:#6FA0E6; --prod:#C9CDD2;
  --ok:#5FD3A5; --ok-bg:#12342A; --warn:#F2B04C; --warn-bg:#3A2A10;
  --s1:#E3916F; --s2:#5DBE9C; --s3:#6FA0E6; --s4:#D3A6E6; --on-bar:#101317; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
.shell{max-width:1120px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
html{scroll-padding-top:calc(var(--head,72px) + 8px)}
@media print{.top{position:static}}
@media (max-width:1000px){.top{padding-block:10px;gap:6px}.top .steps{flex-wrap:nowrap;gap:2px}.top .steps a{padding:5px 7px}.top .steps a.u{padding-inline:10px}.top .steps a:not(.on):not(.u) .t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.brand{font-family:var(--display);font-weight:700;font-size:18px;color:var(--fg);text-decoration:none;letter-spacing:.01em}

.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps a{display:inline-block;font:600 13px var(--display);padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;border:1.5px solid transparent}
.steps a.on{color:var(--fg);border-color:var(--fg)}
.steps .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px;margin-right:6px}
.steps a.on .n{background:var(--accent);color:var(--accent-ink)}

.steps a[aria-disabled="true"]{opacity:.45;pointer-events:none}
.langs{display:flex;gap:2px;font:600 13px var(--display)}

@media (max-width:1000px){.top .brand{order:1}.top .langs{order:2;margin-left:auto}.top #stepsnav{order:3;flex-basis:100%}}
main{padding-block:36px 0}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,32px)}

.eyebrow{font:600 12.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:62ch;margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:20px;padding-block:40px;border-top:1px solid var(--line)}
.section:first-child{border-top:0;padding-top:0}
.btn{font:600 15.5px var(--display);border:0;border-radius:10px;padding:13px 22px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn.g{background:transparent;color:var(--muted);padding-inline:6px}
/* Deliverables (executive report, roadmap, front page): branded, with a document icon, between the secondary actions and the next step */
.btn.d{background:var(--accent-soft);color:var(--accent);border:1.5px solid var(--accent)}
.btn.d:hover{background:#cfe4dd}
.btn.d svg{flex:none}
/* Light green: a strong action that gives way to the main one (home header: the map first, then the diagnostic) */
.btn.l{background:var(--accent-soft);color:var(--accent);border:1.5px solid var(--accent)}
.btn.l:hover{background:#cfe4dd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* Action rows: secondary actions first (left), the one primary "next" action last (right). On a phone the primary
   action takes the full width at the end of the row: same order for the eye and the keyboard, under the thumb. */
.acts .btn.p{margin-left:auto}
.acts.tight .btn.p{margin-left:0}
@media (max-width:560px){.acts .btn.p,.acts.tight .btn.l{flex:1 1 100%;justify-content:center;margin-left:0}}
.why{margin:0;font-size:17px;max-width:62ch}
/* The suggestion rule on the priorities page: a light green frame so it reads as advice, not as body text */
.why.tip{max-width:none;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:12px;padding:12px 16px;color:var(--fg)}
/* The note under the main action sits under that action, on the right; on a phone the button is full width, so the note starts on the left */
.gen-note{margin:10px 0 0 auto;max-width:62ch;text-align:right}
.gen-note.busy{color:var(--accent);font-weight:600}
.gen-note .wc{font:700 20px var(--display);font-variant-numeric:tabular-nums}
@media (max-width:560px){.gen-note{text-align:left;margin-left:0}}
.g-hint{display:none}
@media (max-width:760px){.g-hint{display:block}}
.field .hint{font-size:14.5px;color:var(--muted);margin:6px 0 0}
.and{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,28px)}
.and b{color:var(--accent);white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-art{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:10px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini div{border:2px solid var(--c);border-radius:10px;padding:10px 8px;font:600 12.5px/1.25 var(--display);color:var(--c);min-height:70px;display:flex;align-items:flex-end}
.band{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px var(--display);padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.P{border:1.5px solid var(--prod);color:var(--prod)}
.chip.C{background:var(--accent);color:var(--accent-ink)}
.band-l{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.pillar{border-top:5px solid var(--c)}
.card .k{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--muted))}
.card p{margin:0;color:var(--muted)}
/* Home: hero, model and episodes, journey, author, final call to action */
.home h1{font-size:clamp(30px,4.2vw,46px)}
.series-line{margin:0;font-size:15px;color:var(--muted);max-width:52ch}
.series-line a{color:var(--fg);font-weight:600;text-decoration-color:var(--line);text-underline-offset:3px}
.series-line a:hover{text-decoration-color:var(--fg)}
.facts{margin:0;font:600 14px var(--display);color:var(--muted)}
@media (max-width:860px){.home{padding-top:0}.hero .stack{gap:14px}.hero .sample{max-width:360px}}
.forces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;list-style:none;margin:0;padding:0}
.forces li{border-top:2px solid var(--fg);padding-top:10px;font:600 17px/1.25 var(--display)}
.forces-l{color:var(--muted)}
.ep-quote{font-style:italic;color:var(--fg);margin:6px 0 10px}
.closing{font:600 17px/1.4 var(--display);margin:0;max-width:52ch}
.vid.ep-intro{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:32px;align-items:center}
@media (max-width:860px){.vid.ep-intro{grid-template-columns:minmax(0,1fr);gap:14px}}
.shift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:700px){.shift-grid{grid-template-columns:minmax(0,1fr)}}
.shift-grid .card{gap:10px}
.shift-grid .vlinks{margin-top:auto}
.shift-grid .vframe{margin-bottom:4px}
.vframe{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#12161C;box-shadow:0 0 0 1.5px var(--line)}
.vframe.open{background:#000}
.vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vframe .vmsg{position:absolute;left:10px;right:10px;bottom:10px;margin:0;text-align:center;font:600 13.5px var(--display);color:#FFFFFF;background:rgba(18,22,28,.85);border-radius:6px;padding:6px 10px}
.play{all:unset;box-sizing:border-box;position:absolute;inset:0;cursor:pointer;display:block}
.play:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;color:#12161C;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.play:hover .pbtn{transform:translate(-50%,-50%) scale(1.06)}
.dur{position:absolute;right:10px;bottom:10px;font:600 12.5px var(--display);color:#FFFFFF;background:rgba(18,22,28,.85);border-radius:6px;padding:3px 8px}
.vmeta{display:flex;flex-direction:column;gap:10px;min-width:0;border-top:3px solid var(--c);padding-top:12px}
.vmeta .k{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.vmeta h3{font-size:clamp(19px,2vw,23px)}
.vmeta p{margin:0}
.vlinks{margin:0;font:600 14.5px var(--display)}
.journey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0}
@media (max-width:860px){.journey{grid-template-columns:minmax(0,1fr)}}
.journey .card{gap:10px}
.journey .num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 15px var(--display)}
.journey .card p.get{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--fg)}
.get b{display:block;font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.optional{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:14px 18px}
.optional p{margin:0;max-width:70ch;display:flex;gap:10px;align-items:flex-start}
.optional .bulb{flex:none;margin-top:2px;color:var(--accent)}
.optional .btn{padding:10px 16px;font-size:14.5px}
.author{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;display:flex;align-items:flex-start;gap:20px}
.author-photo{width:112px;height:112px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.author-txt{flex:1;min-width:0}

.author p{margin:0 0 8px;color:var(--muted);max-width:70ch}

@media (max-width:560px){.author{flex-direction:column}.author-photo{width:96px;height:96px}}

.privacy{margin:0;max-width:90ch}

.note{font-size:14.5px;color:var(--muted)}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prof{border:0;padding:0;margin:0 0 24px;min-width:0}
.prof legend{font:600 16px var(--display);margin-bottom:10px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--surface);cursor:pointer;font-size:15px;line-height:1.3}
.chip input:checked+span{border-color:var(--accent);background:var(--accent-soft);font-weight:600}

.contact{margin-top:28px;padding:20px 22px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);max-width:640px}

.contact input[type=email]{flex:1 1 240px;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;min-width:0}
.contact .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* diagnostic */
.q-wrap{display:flex;flex-direction:column;gap:22px}
/* The question and its action row share one reading width: Next lines up with the right edge of the answers */
.q-wrap > *{max-width:760px;width:100%}

.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

.opt .lv{font:700 15px var(--display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}

.scale{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}

.kpi .kto{display:block;font-size:13.5px}
/* Every card ends with its bar: the bars line up even when a label takes two lines */

.kpi > span:not(.kbar):not(.kto){padding-bottom:10px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 52px;gap:12px;align-items:center}
@media (max-width:560px){.bar{grid-template-columns:minmax(0,1fr) 48px}.bar .track{grid-column:1 / -1;grid-row:2}}
.bar .nm{font:600 15px var(--display);color:var(--c)}

.bar .v{font:700 15px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hc{border-radius:12px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.hc .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;font:600 14.5px var(--display)}
.hc .gap{font:700 13px var(--display);padding:2px 8px;border-radius:999px;white-space:nowrap}
.hc .gap{flex:none;align-self:flex-start}
.hc .t span:first-child{min-width:0;overflow-wrap:break-word;hyphens:auto}
.gap.hi{background:var(--accent);color:var(--accent-ink)}
.gap.mid{background:var(--warn-bg);color:var(--warn)}
.gap.lo{background:var(--ok-bg);color:var(--ok)}
.hc small{color:var(--muted);font-size:13.5px}
.flags{display:flex;flex-direction:column;gap:10px}
.flag{background:var(--warn-bg);border-radius:12px;padding:14px 16px}
.flag b{font-family:var(--display);color:var(--warn);display:block;margin-bottom:2px}
.flag p{margin:0}
.ok-box{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px 16px;font-weight:600}
.road-scroll{overflow-x:auto}
.road{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:900px}
.yr{display:flex;flex-direction:column;gap:10px}
.yr h3{font-size:22px;padding-bottom:8px;border-bottom:3px solid var(--fg)}
.ini{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ini .k{font:600 11.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ini b{font-family:var(--display);font-size:15px;line-height:1.25}
.ini p{margin:0;font-size:14.5px;color:var(--muted)}
.ini .req{font-size:13px;color:var(--muted)}
.empty-yr{color:var(--muted);font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
/* vision */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pk{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.pk input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.pk.sel{border-color:var(--accent);background:var(--accent-soft)}
.pk .t{font:600 14.5px var(--display)}
.pk small{display:block;color:var(--muted);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 14.5px var(--display)}
.field input,.field textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field small{color:var(--muted);font-size:13.5px}
.hl{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.err{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* The News Fix — printed paper, same in both themes */
.paper{background:var(--paper);color:var(--ink);max-width:980px;margin:0 auto;padding:28px clamp(16px,4vw,44px) 36px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 40px -20px rgba(0,0,0,.35);font-family:var(--newsbody)}
.np-top{display:flex;justify-content:center;font:600 11px var(--display);letter-spacing:.28em;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:6px;margin-top:6px;color:var(--ink)}
.masthead{font-family:var(--black);font-weight:700;font-size:clamp(42px,8vw,88px);text-align:center;line-height:1;margin:6px 0 2px;color:var(--ink)}
.np-teasers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:8px}
.np-teaser{border:1px solid var(--rule);padding:6px 9px;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.np-t-sec{font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#C8102E}
.np-teaser b{font:700 15px/1.2 var(--news)}
.np-teaser small{font:600 10.5px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.np-head{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) minmax(90px,150px);align-items:center;gap:12px}
.np-ear{border:1px solid var(--rule);padding:6px 8px;font:italic 14px/1.25 var(--news);text-align:center;color:var(--ink)}
.np-ear span{display:block;font:700 10px var(--display);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:#C8102E;margin-bottom:2px}
@media (max-width:640px){.np-teasers{grid-template-columns:minmax(0,1fr)}.np-head{grid-template-columns:minmax(0,1fr)}.np-ear{display:none}}
.np-sub{text-align:center;font:italic 15px var(--newsbody);color:var(--ink-soft)}
.np-date{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;margin:10px 0 18px;font:600 12.5px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.np-date .red{color:#C8102E}
.lead h2{font-family:var(--news);font-weight:900;font-size:clamp(34px,5.6vw,60px);line-height:1.02;text-align:center;color:var(--ink)}
.lead .deck{font:italic 20px/1.4 var(--newsbody);text-align:center;color:var(--ink-soft);margin:10px auto 0;max-width:46ch}
.np-cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px;margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}
@media (max-width:760px){.np-cols{grid-template-columns:minmax(0,1fr)}}
.np-body p{margin:0 0 12px;font-size:16.5px;line-height:1.55;color:var(--ink)}
.kicker{font:700 11.5px var(--display);letter-spacing:.18em;text-transform:uppercase;color:#C8102E;text-align:center;margin-bottom:6px}
.story .kicker{text-align:left}
.qa{margin:0 0 12px}
.qa .q{display:block;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.lead-body{column-count:2;column-gap:26px;column-rule:1px solid rgba(0,0,0,.18)}
.lead-body .qa{break-inside:avoid-column}
.np-body .subhead{font:700 15px/1.25 var(--display);color:var(--ink);margin:4px 0 6px;break-after:avoid-column}
.np-body .subhead:first-child{margin-top:0}
.timeline{border-top:3px solid var(--ink);border-bottom:1px solid var(--rule);padding:8px 0 10px;margin-top:18px}
.timeline h4{margin:0 0 8px;font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.timeline ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;position:relative}
.timeline ol::before{content:'';position:absolute;left:0;right:0;top:10px;border-top:2px solid #C8102E}
.timeline li{display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.35;color:var(--ink)}
@media (max-width:640px){.timeline ol{grid-auto-flow:row}.timeline ol::before{display:none}}
.timeline li b{font:700 14px var(--display);color:#C8102E;background:var(--paper);align-self:flex-start;padding-right:8px;position:relative}
@media (max-width:760px){.lead-body{column-count:1}}
.np-stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 22px;border-top:3px double var(--rule);margin-top:18px;padding-top:14px}
.story.interview .qa .q{color:#C8102E}
.story.column h3,.story.column .np-body p{font-style:italic}
.editorial{border:2px solid var(--ink);padding:10px 12px;margin-bottom:14px;align-self:start}
.editorial h3{font-family:var(--news);font-weight:700;font-size:21px;line-height:1.15;color:var(--ink);margin-bottom:8px}
.editorial small{display:block;text-align:right;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.editorial .kicker{text-align:left}
@media (max-width:1000px){.np-stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.np-stories{grid-template-columns:minmax(0,1fr)}}
.story{border-bottom:1px solid var(--rule);padding:4px 0 14px;margin-bottom:14px}
.story h3{font-family:var(--news);font-weight:700;font-size:24px;line-height:1.12;color:var(--ink);margin-bottom:10px}
.story .qa{font-size:15.5px;line-height:1.5}
.story .qa .q{font-size:12px}
.byline{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.side-story{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:14px}
.side-story:last-child{border-bottom:0}
.side-story h3{font-family:var(--news);font-weight:700;font-size:22px;line-height:1.15;color:var(--ink)}
.side-story p{margin:8px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink)}
.numbers{border:2px solid var(--ink);padding:12px 14px;margin-top:6px}
.numbers h4{margin:0 0 8px;font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.numbers ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.numbers li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;color:var(--ink)}
.numbers li b{font-family:var(--news);font-size:26px;color:#C8102E}
.quote{font:italic 19px/1.4 var(--news);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin:6px 0 14px;color:var(--ink)}
.quote small{display:block;font:600 11.5px var(--display);letter-spacing:.08em;text-transform:uppercase;font-style:normal;color:var(--ink-soft);margin-top:6px}
.np-foot{border-top:3px double var(--rule);margin-top:20px;padding-top:8px;font:12px var(--display);color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* The News Fix as two A4 sheets (794 x 1123 px at 96 dpi), identical on screen and on paper.
   --k is the body type size in px, set by fitSheets() so that each sheet is full. */
.sheets{display:flex;flex-direction:column;align-items:center;gap:28px}
.sheet-wrap{width:min(794px,100%);aspect-ratio:794/1123;position:relative;overflow:hidden}
.sheet{--k:13;position:absolute;top:0;left:0;width:794px;height:1123px;padding:34px 40px 26px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--newsbody);transform-origin:0 0;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 40px -20px rgba(0,0,0,.35)}
.sheet .np-teasers{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-bottom:7px;margin-bottom:4px}
.sheet .np-ear{display:block}
.sheet .timeline ol{grid-auto-flow:column}
.sheet .timeline ol::before{display:block}
.sheet .np-teaser b{font-size:13.5px}
.sheet .np-head{grid-template-columns:130px minmax(0,1fr) 130px}
.sheet .np-ear{font-size:12.5px;padding:5px 6px}
.sheet .masthead{font-size:68px;margin:4px 0 0}
.sheet .np-top{font-size:10px;margin-top:4px;padding-top:5px}
.sheet .np-date{font-size:11px;margin:6px 0 10px;padding:5px 0}
.sheet .kicker{font-size:10.5px;margin-bottom:4px}
.sheet .lead h2{font-size:40px;line-height:1.04}
.sheet .lead .deck{font-size:16px;line-height:1.35;max-width:none;margin-top:8px}
.s1-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2.35fr) minmax(0,1fr);gap:18px;margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.s1-main{display:flex;flex-direction:column;min-height:0}
.s1-side{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.sheet .fit{flex:1;min-height:0;overflow:hidden;column-fill:auto}
.sheet .lead-body{column-count:2;column-gap:18px;column-rule:1px solid rgba(0,0,0,.18)}
.sheet .np-body p{font-size:calc(var(--k) * 1px);line-height:1.36;margin:0 0 .45em}
.sheet .np-body .subhead{font-size:calc(var(--k) * 1.02px);margin:.2em 0 .25em}
.sheet .byline{font-size:10px;margin-bottom:6px}
.sheet .quote{font-size:17px;margin:0;padding:8px 0}
.sheet .numbers{margin:0}
.sheet .numbers li{font-size:13px;line-height:1.3}
.sheet .numbers li b{font-size:22px}
.fun{border-top:3px solid var(--ink);padding-top:6px;break-inside:avoid;margin-bottom:12px}
.fun h4{margin:0 0 4px;font:700 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#C8102E}
.fun p{margin:0 0 .35em;font-size:calc(var(--k,13) * 1px);line-height:1.35;color:var(--ink)}
.s1-side .fun p{font:italic 15px/1.35 var(--news)}
.fun .upside{transform:rotate(180deg);font-size:calc(var(--k,13) * .85px);color:var(--ink-soft);margin-top:6px}
.fun[hidden]{display:none}
.s2-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:3px double var(--rule);padding-bottom:6px;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase}
.s2-mast{font:700 28px var(--black);letter-spacing:0;text-transform:none}
.sheet .timeline{margin-top:10px}
.sheet .timeline li{font-size:13px}
.sheet .np-stories{display:block;column-count:3;column-gap:18px;column-rule:1px solid rgba(0,0,0,.18);margin-top:10px;padding-top:10px;border-top:3px double var(--rule)}
.sheet .story{break-inside:auto;border-bottom:1px solid var(--rule);padding:0 0 .6em;margin-bottom:.8em}
.sheet .st-h{break-inside:avoid;break-after:avoid}
.sheet .story h3,.sheet .editorial h3{font-size:calc(var(--k) * 1.6px);line-height:1.12;margin-bottom:.3em}
.sheet .story .qa{font-size:calc(var(--k) * 1px);line-height:1.36}
.sheet .story .qa .q{font-size:calc(var(--k) * .82px)}
.sheet .editorial{break-inside:avoid;margin-bottom:.8em}
.sheet-foot{display:flex;justify-content:space-between;border-top:3px double var(--rule);margin-top:8px;padding-top:5px;font:11px var(--display);color:var(--ink-soft)}
.paper-label{width:min(794px,100%);margin:0 auto 10px;max-width:none}
/* sample + share card (1080 x 1350, posted on LinkedIn) */
.sample{margin:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;justify-self:center}
.sample figcaption{font-size:13.5px;color:var(--muted);text-align:center}
.sc-frame{width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 40px -20px rgba(0,0,0,.35);background:#F7F3EA}
.sc-frame .share-card{position:absolute;top:0;left:0}
#capture{position:fixed;left:-20000px;top:0;pointer-events:none}

.sc-top{display:flex;justify-content:space-between;font:600 17px var(--display);letter-spacing:.18em;text-transform:uppercase;border-bottom:2px solid #1B1B1B;padding-bottom:12px}
.sc-mast{font-family:var(--black);font-weight:700;font-size:150px;line-height:1;text-align:center;margin:26px 0 12px}

.sc-date .red,.sc-kicker{color:#C8102E}
.sc-kicker{text-align:center;font:700 22px var(--display);letter-spacing:.22em;text-transform:uppercase;margin-top:52px}

.sc-deck{font:italic 31px/1.4 var(--newsbody);text-align:center;color:#4A4A4A;max-width:860px;margin:0 auto}

.share{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:28px;align-items:start;margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.share{grid-template-columns:minmax(0,1fr)}.share .sc-frame{max-width:420px}}
.regen{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:28px;display:flex;flex-direction:column;gap:10px}

.sc-fig{margin:0;display:flex;flex-direction:column;gap:10px}
.sc-fig figcaption{font:600 12.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sc-fig .btn{align-self:stretch;justify-content:center}
@media (max-width:860px){.sc-fig{max-width:420px}}
.post{font:15px/1.5 var(--body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;resize:vertical}
.btn.off{opacity:.4;pointer-events:none}
.tabs{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.tabs button{font:600 14px var(--display);border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
/* A view switch, not an action: the selected view is shown in light green, the solid green stays for the next step */
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.fors{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.g-bar{grid-row:1;align-self:center;height:28px;border-radius:7px;background:var(--c);color:var(--on-bar);font:600 12.5px var(--display);display:flex;align-items:center;padding:0 10px;margin:0 4px;white-space:nowrap}
.g-grp{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c);padding:18px 0 4px}

.brief{display:flex;flex-direction:column;gap:28px;align-items:center}

.b-head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #12161C;padding-bottom:12px}
.b-k{font:700 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#0F6E5D}
.b-org{font:700 22px var(--display);margin-top:2px}
.b-meta{font:500 12.5px var(--display);color:#5A6270;text-align:right}

  // ---------- SCORING ----------
  function scores() {
    const a = S.answers, m = l => (l - 1) / 3 * 100;
    const pillars = {}; SIDS.forEach(s => { const qs = F.questions.filter(q => q.s === s); pillars[s] = qs.reduce((t, q) => t + m(a[q.id]), 0) / qs.length; });
    const ch = {}; Object.keys(F.challenges).forEach(c => { const qs = F.questions.filter(q => q.ch.includes(c)); ch[c] = qs.length ? qs.reduce((t, q) => t + m(a[q.id]), 0) / qs.length : null; });
    const avgOf = g => { const v = Object.keys(ch).filter(c => F.challenges[c].g === g && ch[c] != null).map(c => ch[c]); return v.reduce((t, x) => t + x, 0) / v.length; };
    const P = avgOf('P'), C = avgOf('C');
    const overall = F.questions.reduce((t, q) => t + m(a[q.id]), 0) / F.questions.length;
    return { pillars, ch, P, C, overall, distance: 100 - overall, flags: F.rules.filter(r => r.when(S.answers)) };
  }
  const QBY = Object.fromEntries(F.questions.map(q => [q.id, q]));
  const IBY = Object.fromEntries(F.initiatives.map(i => [i.id, i]));
  const needed = i => (i.step === 'a' && S.answers[i.q] <= 2) || (i.step === 'b' && S.answers[i.q] <= 3);
  // Roadmap for the selected priorities: initiatives that serve them, plus the prerequisites they need
  function roadmap(prios) {
    prios = prios || S.priorities || [];
    const serves = i => QBY[i.q].ch.filter(c => prios.includes(c));
    const set = {};
    const add = (i, direct) => { if (!needed(i)) return; if (set[i.id]) { if (direct) set[i.id].direct = true; return; } set[i.id] = { i, direct }; (i.req || []).forEach(r => add(IBY[r], false)); };
    F.initiatives.forEach(i => { if (serves(i).length) add(i, true); });
    const ids = Object.keys(set), start = {}, depth = {};
    const calc = id => { if (start[id]) return; const i = IBY[id]; let y = i.year, d = 0;
      (i.req || []).forEach(r => { if (set[r]) { calc(r); y = Math.max(y, start[r]); d = Math.max(d, depth[r] + 1); } }); start[id] = Math.min(y, 2030); depth[id] = d; };
    ids.forEach(calc);
    const items = ids.map(id => { const i = IBY[id], dur = i.dur || (i.step === 'a' ? 1 : 2);
      return Object.assign({}, i, { start: start[id], end: Math.min(2030, start[id] + dur - 1), depth: depth[id], direct: set[id].direct, serves: serves(i),
        reqIds: (i.req || []).filter(r => set[r]), after: (i.req || []).filter(r => set[r]).map(r => IBY[r].n) }); })
      .sort((x, y) => x.start - y.start || x.depth - y.depth || SIDS.indexOf(x.s) - SIDS.indexOf(y.s));
    items.forEach(i => { i.unlocks = items.filter(x => x.reqIds.includes(i.id)).map(x => x.id); });
    return { items, byYear: y => items.filter(x => x.start === y) };
  }

  function wrap2(t) { if (t.length <= 15) return [t]; const w = t.split(' '); let best = [t], bd = 1e9;
    for (let k = 1; k < w.length; k++) { const a = w.slice(0, k).join(' '), b = w.slice(k).join(' '), d = Math.abs(a.length - b.length); if (d < bd) { bd = d; best = [a, b]; } } return best; }
  function spider(paper) {
    const a = S.answers, qs = F.questions, n = qs.length, W = 720, H = 600, cx = 360, cy = 300, R = 212;
    const c = paper ? { s: s => PAPER[s], fg: PAPER.fg, muted: PAPER.muted, line: PAPER.line, accent: PAPER.accent }
                    : { s: s => col(s), fg: 'var(--fg)', muted: 'var(--muted)', line: 'var(--line)', accent: 'var(--accent)' };
    const ang = i => (-90 + i * 360 / n) * Math.PI / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const f = v => v.toFixed(1);
    let g = '';
    SIDS.forEach(s => { const idx = qs.map((q, i) => q.s === s ? i : -1).filter(i => i >= 0);
      const a0 = ang(idx[0]) - Math.PI / n, a1 = ang(idx[idx.length - 1]) + Math.PI / n, r = R + 8, large = (a1 - a0) > Math.PI ? 1 : 0;
      g += `<path d="M${cx},${cy} L${f(cx + r * Math.cos(a0))},${f(cy + r * Math.sin(a0))} A${r},${r} 0 ${large} 1 ${f(cx + r * Math.cos(a1))},${f(cy + r * Math.sin(a1))} Z" fill="${c.s(s)}" fill-opacity="0.09"/>`; });
    [1, 2, 3, 4].forEach(l => { const pts = qs.map((q, i) => pt(i, R * l / 4).map(f).join(',')).join(' ');

    const dp = qs.map((q, i) => pt(i, R * (a[q.id] || 0) / 4).map(f).join(',')).join(' ');

    return `<svg class="spider" viewBox="-80 0 ${W + 160} ${H}" role="img" aria-label="${T('Maturity profile on the 14 practices, from Emerging to Excellence · 2030-ready')}">${g}</svg>`;
  }

  // System effect: how many shifts a set of priorities mobilizes, and how many initiatives are linked across shifts
  function systemStats(rm) {

  // Gantt dependency arrows, drawn after layout
  function drawArrows() {
    const box = document.querySelector('.gantt'); if (!box) return;
    box.querySelector('svg.g-arrows')?.remove();
    const B = box.getBoundingClientRect(), bars = {};
    box.querySelectorAll('.g-bar[data-id]').forEach(b => { bars[b.dataset.id] = b.getBoundingClientRect(); });
    let p = '';
    box.querySelectorAll('.g-bar[data-id]').forEach(b => { const to = bars[b.dataset.id];
      (b.dataset.req || '').split(' ').filter(Boolean).forEach(r => { const fr = bars[r]; if (!fr) return;
        const cross = b.dataset.s !== box.querySelector(`.g-bar[data-id="${r}"]`).dataset.s;
        const y1 = fr.top + fr.height / 2 - B.top, x2 = to.left - B.left + 1, y2 = to.top + to.height / 2 - B.top, F1 = v => v.toFixed(1);
        let d;

      <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="im"/></marker></defs>${p}</svg>`);
    const on = id => { box.dataset.cur = id || ''; box.classList.toggle('focus', !!id); box.querySelectorAll('svg.g-arrows path[data-a]').forEach(q => q.classList.toggle('on', q.dataset.a === id || q.dataset.b === id));

      box.addEventListener('click', e => { const g = e.target.closest('.g-bar[data-id]'); on(g && !g.classList.contains('sel') ? g.dataset.id : null); box.querySelectorAll('.g-bar.sel').forEach(q => q.classList.remove('sel')); if (g && box.classList.contains('focus')) g.classList.add('sel'); }); }
  }

  // Printing the Gantt on one A4 page: the roadmap is laid out compact at a fixed width, in portrait or in landscape,

  function epFrame(e) {
    if (!e.poster_url && !e.video_url) return '';

    const poster = e.poster_url ? `<img class="poster" src="${esc(e.poster_url)}" alt="" width="1280" height="720" loading="lazy" decoding="async">` : '';
    const dur = e.duration ? `<span class="dur"><span class="vh">${T('Duration:')} </span>${esc(e.duration)}</span>` : '';
    if (!e.video_url) return `<div class="vframe">${poster}${dur}</div>`;
    const label = isBonus(e) ? T('Play the bonus episode: {t}', { t: e.title }) : T('Play episode {e}: {t}', { e: n, t: e.title });
    return `<div class="vframe" data-ep="${esc(e.id)}"><button type="button" class="play" aria-label="${esc(label)}">${poster}${PLAY_ICON}${dur}</button></div>`;
  }
  const epLink = e => e.linkedin_url ? `<p class="vlinks"><a href="${esc(e.linkedin_url)}" target="_blank" rel="noopener" aria-label="${esc(isBonus(e) ? T('Comment on the bonus episode on LinkedIn (opens in a new tab)') : T('Comment on episode {e} on LinkedIn (opens in a new tab)', { e: epNum(e) }))}">${T('Comment on LinkedIn')}</a></p>` : '';
  function playEpisode(frame) {
    const e = EPS().find(x => x.id === frame.dataset.ep); if (!e || !e.video_url) return;
    document.querySelectorAll('.vframe video').forEach(o => o.pause()); // one episode plays at a time
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'none'; v.setAttribute('playsinline', '');

    v.setAttribute('aria-label', isBonus(e) ? T('Bonus episode: {t}', { t: e.title }) : T('Episode {e}: {t}', { e: epNum(e), t: e.title }));
    const src = document.createElement('source'); src.src = e.video_url; src.type = 'video/mp4';
    src.addEventListener('error', () => { if (v.readyState > 0 || frame.querySelector('.vmsg')) return; const m = document.createElement('p'); m.className = 'vmsg'; m.setAttribute('role', 'status'); m.textContent = T('This video is not available.'); frame.appendChild(m); });
    v.appendChild(src);

  // ---------- EXECUTIVE REPORT-OUT (deliverable of step 1, for the ExCom) ----------
  const joinAnd = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + (FRL ? ' et ' : ' and ') + xs[xs.length - 1];
  const theseThree = t => FRL ? t.replace('Vos 3 priorités', 'Ces 3 priorités') : t.replace('Your 3 priorities', 'These 3 priorities');
  function briefData() {
    const r = scores(), co = S.company || T('Our organization');
    const top = defaultPriorities();
    const rm = roadmap(top);
    const first = rm.items.filter(i => i.start === 2027);
    const contra = r.flags.filter(f => f.kind !== 'limit'), sys = systemSentence(rm, top.length);
    const ranked = SIDS.slice().sort((x, y) => r.pillars[y] - r.pillars[x]);
    const weaker = r.P < r.C ? 'productivity' : r.C < r.P ? 'culture' : null;
    const pl = (k, a, b) => k > 1 ? b : a;
    const summary = FRL ? [
      `${co} a parcouru ${pct(r.overall)} % du chemin vers la cible 2030 du modèle Future of Work. La maturité productivité est de ${pct(r.P)} % et la maturité culture de ${pct(r.C)} %.` +
        (weaker ? ` ${weaker === 'productivity' ? 'La productivité' : 'La culture'} est la contrainte : un progrès d’un côté ne compense pas l’autre.` : ' Les deux côtés sont au même niveau, condition pour que les progrès s’additionnent.'),
      `Le shift le plus avancé est ${F.shifts[ranked[0]].n} (${pct(r.pillars[ranked[0]])} %). Le moins avancé est ${F.shifts[ranked[3]].n} (${pct(r.pillars[ranked[3]])} %).`,
      contra.length ? `${contra.length} contradiction${pl(contra.length, '', 's')} entre les pratiques actuelles ${pl(contra.length, 'annule', 'annulent')} une partie de l’effort, à commencer par : ${lc(contra[0].t)}.` : 'Aucune contradiction entre les pratiques actuelles : les shifts déjà engagés vont dans le même sens.',
      `Nous recommandons de se concentrer sur trois priorités, ${joinAnd(top.map(c => F.challenges[c].n.toLowerCase()))}, et de commencer en 2027 par ${first.length} initiative${pl(first.length, '', 's')}. ${theseThree(sys)}`
    ] : [

  // ---------- 2. YOUR PRIORITIES (selection, then the roadmap, updated live) ----------
  // Suggested priorities, one rule an ExCom can check: the largest gap in productivity, the largest gap in culture
  // (productivity and culture move together: one side does not make up for the other), then the second largest gap
  // on the weaker side. On equal gaps, the challenge whose roadmap shares the most initiatives
  // with the ones already chosen wins (one effort serves several priorities), then the model order.
  // The lead story (first) is the largest gap of the three.
  const weakerSide = () => { const r = scores(), p = pct(r.P), c = pct(r.C); return p < c ? 'P' : c < p ? 'C' : null; };
  function defaultPriorities() {
    const r = scores(), gap = c => Math.round(r.ch[c] * 1000);
    const all = Object.keys(F.challenges).filter(c => r.ch[c] != null), ids = c => roadmap([c]).items.map(i => i.id);
    const best = (pool, chosen) => { const near = new Set(chosen.flatMap(ids)), share = c => ids(c).filter(id => near.has(id)).length;
      return pool.map((c, k) => ({ c, k, g: gap(c), s: share(c) })).sort((x, y) => x.g - y.g || y.s - x.s || x.k - y.k)[0]?.c; };
    const pick = [], from = g => all.filter(c => !pick.includes(c) && (!g || F.challenges[c].g === g));
    const add = pool => { const c = best(pool, pick); if (c) pick.push(c); };
    const w = weakerSide();
    add(from('P')); add(from('C')); add(from(w).length ? from(w) : from(null));
    return pick.map((c, k) => ({ c, k, g: gap(c) })).sort((x, y) => x.g - y.g || x.k - y.k).map(x => x.c).slice(0, MINP);
  }

      : T('Largest gap in productivity, largest gap in culture, then the largest remaining gap.');
    return w ? T('We suggest your largest gap in productivity, your largest gap in culture, and your second largest gap in {side}, because productivity and culture must move together.', { side })
      : T('We suggest your largest gap in productivity, your largest gap in culture, and your largest remaining gap, because productivity and culture must move together.');
  }

  function interview(c, rm) {
    const a = S.answers, qs = F.questions.filter(q => q.ch.includes(c));
    const own = rm.items.filter(i => i.serves.includes(c));
    const pre = new Set(); const walk = i => (i.req || []).forEach(r => { const x = rm.items.find(y => y.id === r); if (x && !pre.has(x)) { pre.add(x); walk(x); } }); own.forEach(walk);
    const acts = [...new Set([...pre, ...own])].sort((x, y) => x.start - y.start || x.depth - y.depth);
    return { before: qs.map(q => ({ topic: q.topic, text: q.o[a[q.id] - 1], level: a[q.id] })), after: qs.map(q => ({ topic: q.topic, text: q.o[3] })),
      actions: acts.map(i => ({ year: i.start, name: i.n, what: i.d })) };
  }

  // Reads the Anthropic event stream forwarded by /api/newsfix and rebuilds the article (JSON) from the text deltas.
  // onWords shows the progress. Rejects with a short reason, kept to explain the front page without AI.
  async function readNewsroom(res, onWords, onAlive) {
    if (!res.ok || !/event-stream/.test(res.headers.get('content-type') || '')) {
      const e = await res.json().catch(() => ({})); throw new Error(e.error ? e.error + (e.status ? ' ' + e.status : '') : 'http ' + res.status);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', stop = null;
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      if (onAlive) onAlive(); // any byte counts: the model thinks silently before its first word
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(l.slice(5)); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onWords((text.match(/\s+/g) || []).length); }
        else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
        else if (ev.type === 'error') throw new Error('api ' + ((ev.error && ev.error.type) || ''));
      }
    }
    if (stop && stop !== 'end_turn') throw new Error('stop ' + stop);
    let data; try { data = JSON.parse(text); } catch (e) { throw new Error('json'); }
    if (!okArticle(data)) throw new Error('invalid');
    return data;
  }
  async function generate() {
    if (!papersLeft()) { render(); return; }
    const btn = document.getElementById('gen'), msg = document.getElementById('genmsg');
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${T('Printing…')}`; msg.classList.add('busy'); msg.textContent = T('The newsroom is writing your front page. It takes about a minute.');
    const body = payload();
    const ctl = new AbortController(); let idle;
    // Gives up after 2 minutes without any data, or 4 minutes in all. The model first thinks without writing
    // a word: a limit counted on words only (60 s) cut the long front pages before they started.
    const wait = () => { clearTimeout(idle); idle = setTimeout(() => ctl.abort(), 120000); };
    const cap = setTimeout(() => ctl.abort(), 240000);
    try {
      wait();
      const res = await fetch('/api/newsfix', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
      S.paper = await readNewsroom(res, n => { wait(); msg.innerHTML = T('The newsroom is writing your front page: {n} words so far.', { n: `<span class="wc">${n}</span>` }); }, wait);
      S.paperSource = 'ai'; S.paperError = null; paperMade();
    } catch (e) { S.paper = offline(body); S.paperSource = 'template'; S.paperError = ctl.signal.aborted ? 'timeout' : String(e && e.message || e).slice(0, 60); }
    clearTimeout(idle); clearTimeout(cap);
    S.paperContext = body.context; S.paperKey = paperKey(); save(); ping('frontpage'); sendPriorities();
    if (location.hash === '#/newsfix') { render(); window.scrollTo(0, 0); } else location.hash = '#/newsfix';
  }
  const okText = x => typeof x === 'string' && x.trim() !== '';
  const okParas = x => Array.isArray(x) && x.length > 0 && x.every(okText);
  const okArticle = d => d && d.lead && okText(d.lead.headline) && Array.isArray(d.lead.sections) && d.lead.sections.length > 0 && d.lead.sections.every(x => x && okParas(x.paragraphs))
    && Array.isArray(d.stories) && d.stories.every(x => x && okText(x.headline) && okParas(x.paragraphs));
  // Without AI: the interviews are laid out directly from the diagnostic, the 2030 target and the roadmap
  function offline(p) {
    const list = xs => xs.map(x => `${x.topic}${FRL ? ' :' : ':'} ${lc(x.text)}`).join(' ');
    const qa = x => [
      { q: QS[0], a: `${x.problem} ${list(x.before)}` },
      { q: QS[1], a: list(x.after) },
      { q: QS[2], a: x.actions.length ? (FRL ? 'Étape par étape. ' : 'Step by step. ') + x.actions.map(i => `${i.year}${FRL ? ' :' : ':'} ${i.name}.`).join(' ') : T('We kept what was already in place and scaled it.') }];
    const [a, ...rest] = p.items, co = p.company;
    const deck = FRL ? `Quatre ans après son diagnostic, l’équipe de direction de ${co} répond à trois questions : comment était-ce avant, comment est-ce aujourd’hui, et qu’a-t-elle fait pour y arriver.`
      : `Four years after its diagnostic, the leadership team of ${co} answers three questions: what was it like before, what is it like today, and what did they do to get there.`;
    return { lead: { headline: a.example, deck, qa: qa(a) },
      stories: rest.map(x => ({ headline: x.example, qa: qa(x) })), quote: { text: T('We did not automate yesterday. We redesigned tomorrow.'), who: T('A member of the leadership team') } };
  }
  function postText() {
    if (FRL) return `Je viens d’écrire la Une 2030 de ${S.company || 'mon organisation'} avec le diagnostic Future of Work · 4 Shifts de Vincent Dupuis.\n\nArticle principal : « ${S.paper.lead.headline} »\n\nQuatorze questions, une feuille de route pour vos priorités, et votre propre Une. Que dira la vôtre ?\n${siteHost()}\n\n#FutureOfWork`;
    return `I just wrote the 2030 front page of ${S.company || 'my organization'} with the Future of Work · 4 Shifts diagnostic by Vincent Dupuis.\n\nLead story: "${S.paper.lead.headline}"\n\nFourteen questions, a roadmap for your priorities, and your own front page. What will yours say?\n${siteHost()}\n\n#FutureOfWork`;
  }
  // Paper text: removes escape codes written as text by the model and sets the French spacing
  const tx = t => { let v = String(t == null ? '' : t).replace(/\\u00a0/gi, ' ');
    if (FRL) v = v.replace(/\s+([:;!?»%])/g, '\u00a0$1').replace(/«\s*/g, '«\u00a0');
    return esc(v); };
  const parasHtml = list => list.map(x => `<p>${tx(x)}</p>`).join('');
  const sectionsHtml = list => list.map(x => `${x.subhead ? `<h4 class="subhead">${tx(x.subhead)}</h4>` : ''}${parasHtml(x.paragraphs)}`).join('');
  const leadBody = l => l.sections ? sectionsHtml(l.sections) : qaHtml(l.qa);
  const storyBody = x => x.paragraphs ? parasHtml(x.paragraphs) + (Array.isArray(x.qa) && x.qa.length ? qaHtml(x.qa) : '') : qaHtml(x.qa);
  const kicker = x => tx(x.kicker || T('Interview'));
  function qaHtml(list) { return list.map((x, i) => `<p class="qa"><b class="q">${tx(x.q || QS[i] || '')}</b> ${tx(x.a)}</p>`).join(''); }
  const quoted = t => FRL ? `« ${tx(t)} »` : `"${tx(t)}"`;
  // Newspaper furniture: teasers above the masthead, ears, motto, folio line
  function paperHead(p, co) {
    const pages = ['B2', 'C4', 'D1'];
    const teasers = Array.isArray(p.teasers) && p.teasers.length ? `<div class="np-teasers">${p.teasers.slice(0, 3).map((t, i) => `<div class="np-teaser"><span class="np-t-sec">${tx(t.section)}</span><b>${tx(t.headline)}</b><small>${T('Page {p}', { p: pages[i] })}</small></div>`).join('')}</div>` : '';
    return `${teasers}<div class="np-head"><div class="np-ear">${T('The insiders’ view')}</div><div class="masthead">The News Fix</div>
        <div class="np-ear r">${p.weather ? `<span>${T('Weather')}</span>${tx(p.weather)}` : `<span>${T('Special edition')}</span>${T('The human edition')}`}</div></div>
      <div class="np-top"><span>${T('Serving the sky, the moon and the stars')}</span></div>
      <div class="np-date"><span>${esc(paperDate())}</span><span>${T('Special edition · No. 2030')}</span><span>${esc(co)} · ${T('€3')}</span></div>`;
  }
  const storyFormat = { portrait: 'Portrait', explainer: 'Explainer', interview: 'Interview', column: 'Opinion' };
  function newsfix() {
    const p = S.paper; if (!p || !p.lead || !(p.lead.qa || p.lead.sections)) return `<p>${T('No front page yet.')} <a href="#/priorities">${T('Back to your priorities')}</a>.</p>`;
    const co = S.company || T('Your organization'), ctx = S.paperContext || {}, ex = p.extras || {};
    const nums = [[window.num(ctx.progress != null ? ctx.progress : 100 - ctx.distance), T('of the way to the 2030 target in the 2026 diagnostic')], [window.num(ctx.productivity), T('productivity maturity in 2026')], [window.num(ctx.culture), T('culture maturity in 2026')], [String(ctx.initiatives), T('initiatives on the 2027–2030 roadmap')]]
      .filter(n => !/undefined/.test(n[0])).map(n => `<li><b>${esc(n[0])}</b><span>${esc(n[1])}</span></li>`).join('');
    const banner = paperStale()
      ? `<div class="regen no-print"><p><b>${T('Your answers, priorities, organization name or language have changed since this front page.')}</b></p>
          ${papersLeft() ? `<div class="row acts"><button class="btn p" id="gen">${T('Generate it again with my changes →')}</button></div><p class="note gen-note" id="genmsg">${leftNote().trim()}</p>`
            : `<p class="note">${T('You have printed your {n} front pages.', { n: MAX_PAPERS })} ${T('To go further,')} ${contactLink()}</p>`}</div>`
      : papersLeft() === 1 && S.paperSource === 'ai' ? `<div class="regen no-print"><p>${leftNote().trim()}</p></div>` : '';
    return `${banner}<div class="share no-print"><div class="stack"><div class="eyebrow">${T('Step 3 · Your News Fix')}</div><h1>${T('Your 2030 vision is on the front page')}</h1><h2>${T('Share it on LinkedIn')}</h2>
        <p class="lede">${T('The image shows your 2030 headlines only. Your diagnostic figures stay private.')}</p>
        <div class="row"><button class="btn s" id="cp">${T('Copy the post text')}</button><a class="btn g" href="https://www.linkedin.com/feed/" target="_blank" rel="noopener">${T('Open LinkedIn ↗')}</a></div>
        <textarea id="posttext" class="post" readonly rows="7" aria-label="${T('Suggested post text')}">${esc(postText())}</textarea>
        <p class="note" id="sharemsg">${T('Download the image, copy the text, then create a post on LinkedIn and add the image.')}</p></div>
        <figure class="sc-fig"><figcaption>${T('Image for LinkedIn')}</figcaption><div class="sc-frame">${shareCard(p, S.company, siteHost())}</div>
          <button class="btn p" id="dl">${DOC}${T('Download this image')}</button></figure></div>
      <div class="eyebrow paper-label no-print">${T('Your full front page')}</div>
      <div class="sheets" id="paper">
      <div class="sheet-wrap"><section class="sheet s1" aria-label="${T('Page {p}', { p: 1 })}">
        ${paperHead(p, co)}
        <div class="lead"><div class="kicker">${kicker(p.lead)}</div><h2>${tx(p.lead.headline)}</h2>${p.lead.deck ? `<p class="deck">${tx(p.lead.deck)}</p>` : ''}</div>
        <div class="s1-body"><div class="s1-main"><div class="byline">${T(p.lead.sections ? 'By the News Fix newsroom' : 'Interview by the News Fix newsroom')}</div><div class="np-body lead-body fit">${leadBody(p.lead)}</div></div>
          <aside class="s1-side">${p.quote && p.quote.text ? `<div class="quote">${quoted(p.quote.text)}<small>${tx(p.quote.who || '')}</small></div>` : ''}
            ${nums ? `<div class="numbers"><h4>${T('From the 2026 diagnostic')}</h4><ul>${nums}</ul></div>` : ''}
            ${ex.pun ? `<div class="fun filler" data-prio="1"><h4>${T('Pun of the day')}</h4><p>${tx(ex.pun)}</p></div>` : ''}</aside></div>
        <div class="sheet-foot"><span>${T('Written with the Future of Work · 4 Shifts model')}</span><span>1</span></div></section></div>
      <div class="sheet-wrap"><section class="sheet s2" aria-label="${T('Page {p}', { p: 2 })}">
        <div class="s2-top"><span class="s2-mast">The News Fix</span><span>${esc(paperDate())}</span><span>${esc(co)}</span></div>
        ${Array.isArray(p.timeline) && p.timeline.length ? `<div class="timeline"><h4>${T('The road to 2030')}</h4><ol>${p.timeline.map(t => `<li><b>${esc(t.year)}</b><span>${tx(t.text)}</span></li>`).join('')}</ol></div>` : ''}
        <div class="np-stories fit">${p.stories.map(x => `<article class="story ${esc(x.format || '')}"><header class="st-h"><div class="kicker">${kicker(x)}${storyFormat[x.format] ? ` · ${T(storyFormat[x.format])}` : ''}</div><h3>${tx(x.headline)}</h3></header><div class="np-body">${storyBody(x)}</div></article>`).join('')}
          ${p.editorial && p.editorial.headline ? `<aside class="editorial"><div class="kicker">${T('Editorial')}</div><h3>${tx(p.editorial.headline)}</h3><div class="np-body">${parasHtml(p.editorial.paragraphs || [])}</div><small>${T('The editor-in-chief')}</small></aside>` : ''}
          ${ex.riddle && ex.riddle.question ? `<div class="fun filler" data-prio="3"><h4>${T('The riddle')}</h4><p>${tx(ex.riddle.question)}</p><p class="upside">${T('Answer:')} ${tx(ex.riddle.answer)}</p></div>` : ''}
          ${Array.isArray(ex.horoscope) && ex.horoscope.length ? `<div class="fun filler" data-prio="2"><h4>${T('Work horoscope')}</h4>${ex.horoscope.map(h => `<p><b>${tx(h.sign)}.</b> ${tx(h.text)}</p>`).join('')}</div>` : ''}</div>
        <div class="sheet-foot"><span>${T('More human. More digital. Not a trade-off. AND.')}</span><span>2</span></div></section></div></div>
      <div class="section no-print" style="margin-top:24px"><div class="row acts"><a class="btn g" href="#/priorities">${T('← Back to your priorities and roadmap')}</a><button class="btn p" id="print">${DOC}${T('Print the front page (PDF, 2 pages)')}</button></div>
      ${S.paperSource === 'template' ? `<p class="note">${T('The AI newsroom was not reachable, so the interviews were laid out directly from your diagnostic and roadmap, without AI.')}${S.paperError ? ` <small>(${esc(S.paperError)})</small>` : ''}</p>` : ''}${contactBox()}</div>
      <div id="capture" aria-hidden="true">${shareCard(p, S.company, siteHost())}</div>`;
  }
  async function downloadImage() {
    const msg = document.getElementById('sharemsg'), btn = document.getElementById('dl');
    if (typeof window.html2canvas !== 'function') { msg.textContent = T('The image tool did not load. Check your connection and reload the page.'); return; }
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${T('Preparing…')}`;
    try {
      await document.fonts.ready;
      const canvas = await window.html2canvas(document.querySelector('#capture .share-card'), { scale: 1, width: 1080, height: 1350, backgroundColor: '#F7F3EA', logging: false });
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'the-news-fix-2030.png'; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      msg.textContent = T('Image downloaded: the-news-fix-2030.png. Now copy the text and create your LinkedIn post.'); ping('image');
    } catch (e) { msg.textContent = T('The image could not be created. Try again, or take a screenshot of the preview.'); }
    btn.disabled = false; btn.innerHTML = DOC + T('Download this image');
  }
  function bindNewsfix() {
    bindContact();
    const gen = document.getElementById('gen'); if (gen) gen.onclick = generate;
    document.getElementById('print').onclick = () => window.print();
    document.getElementById('dl').onclick = downloadImage;
    document.getElementById('cp').onclick = async () => { const ta = document.getElementById('posttext'), msg = document.getElementById('sharemsg');
      try { await navigator.clipboard.writeText(ta.value); msg.textContent = T('Text copied. Paste it in your LinkedIn post.'); }
      catch (e) { ta.focus(); ta.select(); msg.textContent = T('Select the text and copy it with your keyboard.'); } };
  }

  // ---------- RENDER ----------
  // One visit per browser session (a reload or a change of page does not count again).
  try { if (!sessionStorage.getItem('fow4_visit')) { sessionStorage.setItem('fow4_visit', '1'); ping('visit'); } } catch (x) {}
  function render() {
    let route = location.hash || '#/';
    const alias = { '#/vision': '#/priorities', '#/roadmap': '#/priorities', '#/report': '#/diagnostic' };
    route = alias[route] || route;
    // The next steps need all the answers and the acceptance of the anonymous statistics
    if ((route === '#/priorities' || route === '#/brief' || route === '#/newsfix') && !(done() && shared())) route = '#/diagnostic';
    if (route === '#/newsfix' && !hasPaper()) route = done() ? '#/priorities' : '#/diagnostic';
    if (!STEPS.some(s => s[0] === route) && route !== '#/brief') route = '#/';
    nav(route === '#/brief' ? '#/diagnostic' : route);
    const v = document.getElementById('view');
    if (route === '#/map') { v.innerHTML = mapView(); window.initMap(); }
    else if (route === '#/diagnostic') { if (done() && !S.editing && shared() && !S.profileSeen) { v.innerHTML = profile(); bindProfile(); } else if (done() && !S.editing) { v.innerHTML = report(); bindReport(); } else { v.innerHTML = questions(); bindQuestions(); } }
    else if (route === '#/brief') { v.innerHTML = brief(); bindBrief(); }
    else if (route === '#/priorities') { v.innerHTML = priorities(); bindPriorities(); }
    else if (route === '#/newsfix') { v.innerHTML = newsfix(); bindNewsfix(); fitSheets(); if (document.fonts) document.fonts.ready.then(fitSheets); }
    else { v.innerHTML = home(); bindHome(); }
    fitCards();
  }
  let last = location.hash;
  const headVar = () => { const t = document.querySelector('.top'); if (t) document.documentElement.style.setProperty('--head', t.offsetHeight + 'px'); };
  headVar(); window.addEventListener('resize', headVar);
  window.addEventListener('hashchange', () => { if (last === '#/priorities') sendPriorities(); render(); if (location.hash !== last) window.scrollTo(0, 0); last = location.hash; });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && location.hash === '#/priorities') sendPriorities(); });
  render();
  if (document.fonts) document.fonts.ready.then(fitCards);
});
</script>

</body></html>
